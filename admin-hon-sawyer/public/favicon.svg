<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00874A" />
      <stop offset="50%" stop-color="#006837" />
      <stop offset="100%" stop-color="#004725" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE8B3" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E780E" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- Inner Subtle Hairline Accent -->
  <rect x="11" y="11" width="106" height="106" rx="23" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5" />

  <!-- Leadership Star -->
  <polygon points="64,20 67.8,30 78,30 69.8,36.5 73,46.5 64,40.5 55,46.5 58.2,36.5 50,30 60.2,30" fill="url(#starGrad)" filter="url(#shadow)" />

  <!-- Official QP Monogram (Queenstar Pokua) -->
  <g fill="#FFFFFF" filter="url(#shadow)">
    <!-- Letter Q -->
    <path d="M 33 69 C 33 55.5 40 48 49 48 C 58 48 64.5 55.5 64.5 69 C 64.5 76 61.5 82 56 86.5 L 61.5 93 L 56.5 94.5 L 51.5 88.5 C 50.5 89 49.5 89.2 48.5 89.2 C 39.5 89.2 33 82 33 69 Z M 41.5 69 C 41.5 78.5 44.5 83.5 49 83.5 C 53.5 83.5 56.5 78.5 56.5 69 C 56.5 59 53.5 54 49 54 C 44.5 54 41.5 59 41.5 69 Z" />

    <!-- Letter P -->
    <path d="M 68 49 L 83.5 49 C 90.5 49 95 53 95 60 C 95 67 90.5 71 83.5 71 L 76 71 L 76 94 L 68 94 Z M 76 55.5 L 76 64.5 L 82.5 64.5 C 85.5 64.5 87 63 87 60 C 87 57 85.5 55.5 82.5 55.5 Z" />
  </g>

  <!-- Ghana Tricolor Bar at Bottom -->
  <g transform="translate(36, 106)">
    <rect x="0" y="0" width="17" height="4.5" rx="2.25" fill="#007A43" />
    <rect x="19.5" y="0" width="17" height="4.5" rx="2.25" fill="url(#goldGrad)" />
    <rect x="39" y="0" width="17" height="4.5" rx="2.25" fill="#D61F33" />
  </g>
</svg>
